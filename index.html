<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pick the next song</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2b2620;
    --paper: #f7ecd8;
    --card: #fffaf1;
    --card-line: #e7d8ba;
    --red: #e8503a;
    --red-dark: #c93f2c;
    --yellow: #f2b134;
    --muted: #8a7f6a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 28px 16px 60px;
    background:
      radial-gradient(circle at 15% 10%, rgba(242,177,52,0.18), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(232,80,58,0.14), transparent 45%),
      var(--paper);
    color: var(--ink); font-family: "Nunito", -apple-system, system-ui, "PingFang TC", sans-serif;
  }
  h1 {
    text-align: center; font-family: "Kalam", cursive; font-weight: 700;
    font-size: 2rem; margin: 4px 0 6px; color: var(--ink);
  }
  .sub {
    text-align: center; color: var(--muted); font-size: 0.95rem;
    margin-bottom: 24px; max-width: 380px; margin-left: auto; margin-right: auto;
    line-height: 1.45;
  }
  .card {
    max-width: 440px; margin: 0 auto; background: var(--card); border-radius: 22px;
    padding: 22px; box-shadow: 0 10px 0 var(--card-line), 0 14px 30px rgba(43,38,32,0.12);
    border: 2px solid var(--ink);
  }
  input[type=text], input[type=number] {
    width: 100%; padding: 13px 14px; border-radius: 12px; border: 2px solid var(--card-line);
    background: #fff; color: var(--ink); font-size: 1rem; margin-top: 6px;
    font-family: "Nunito", sans-serif; font-weight: 700;
  }
  input[type=text]:focus, input[type=number]:focus { outline: none; border-color: var(--red); }
  label {
    font-size: 0.82rem; color: var(--muted); font-weight: 800; letter-spacing: 0.02em;
    text-transform: uppercase; display: block; margin-top: 18px;
  }
  button {
    width: 100%; padding: 15px; border-radius: 14px; border: 2px solid var(--ink);
    font-size: 1.05rem; font-weight: 800; margin-top: 10px; cursor: pointer;
    font-family: "Nunito", sans-serif;
  }
  #loadBtn { background: #fff; color: var(--ink); }
  #previewBtn { background: #fff; color: var(--red-dark); border-color: var(--card-line); }
  #payBtn {
    background: var(--red); color: #fff; border-color: var(--red-dark);
    font-size: 1.2rem; box-shadow: 0 4px 0 var(--red-dark);
  }
  #payBtn:active:not(:disabled) { transform: translateY(2px); box-shadow: none; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  #deck { display: none; margin-top: 20px; }
  .vinyl {
    width: 84px; height: 84px; border-radius: 50%; margin: 4px auto 14px;
    background: repeating-radial-gradient(circle, #2b2620 0 3px, #4a4236 3px 6px);
    border: 3px solid var(--yellow); position: relative;
    animation: spin 3s linear infinite; animation-play-state: paused;
  }
  .vinyl.spin { animation-play-state: running; }
  .vinyl::after {
    content: ""; position: absolute; top: 50%; left: 50%; width: 16px; height: 16px;
    background: var(--card); border-radius: 50%; transform: translate(-50%, -50%);
  }
  @keyframes spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }
  #ytplayer { width: 100%; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; margin-top: 10px; border: 2px solid var(--ink); }
  .range-wrap { margin-top: 14px; }
  input[type=range] { width: 100%; accent-color: var(--red); }
  .clip-label { text-align: center; font-size: 1rem; color: var(--red-dark); margin-top: 8px; font-weight: 800; }
  .clip-note { text-align: center; font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
  .amount-row { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  .amount-row span { font-size: 1.4rem; color: var(--red-dark); font-weight: 800; }
  #status { text-align: center; margin-top: 14px; font-size: 0.9rem; color: var(--red-dark); min-height: 1.2em; font-weight: 700; }
</style>
</head>
<body>
  <h1>Pick a Song!</h1>
  <div class="sub">Paste a YouTube link, choose where it starts, and donate to queue it up — the more you give, the longer your clip plays.</div>

  <div class="card">
    <label for="url">YouTube link</label>
    <input id="url" type="text" placeholder="https://youtube.com/watch?v=...">
    <button id="loadBtn">Load track</button>

    <div id="deck">
      <div class="vinyl" id="vinyl"></div>
      <div id="ytplayer"></div>
      <div class="range-wrap">
        <input id="startRange" type="range" min="0" max="0" value="0" step="1">
      </div>
      <div class="clip-label" id="clipLabel">--:-- → --:--</div>
      <div class="clip-note" id="clipNote"></div>
      <button id="previewBtn">Preview 5s</button>

      <label for="amount">Your donation (AUD)</label>
      <div class="amount-row">
        <span>$</span>
        <input id="amount" type="number" min="2" max="100" step="1" value="3">
      </div>

      <button id="payBtn">Pay & queue my song</button>
      <div id="status"></div>
    </div>
  </div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
// This page is hosted on GitHub Pages (fast, no tunnel-provider warning
// interstitial for people scanning the QR code) but the actual backend
// still lives behind a Cloudflare Quick Tunnel — update this if that URL
// changes (it does whenever the cloudflared process restarts, since this
// setup doesn't use a reserved domain).
const API_BASE = 'https://fly-fancy-back-subscribers.trycloudflare.com';

// Mirrors AMOUNT_TIER_CENTS / AMOUNT_TIER_SECONDS / UNCAPPED_CLIP_SECONDS in
// busker/busking_bot.py — the server is authoritative, this is only for
// showing an accurate preview before checkout. Keep both in sync by hand.
const AMOUNT_TIER_CENTS = [900, 2000, 5000, 9999]; // 9999 so $100 itself (10000) falls through to uncapped
const AMOUNT_TIER_SECONDS = [20, 30, 45, 90];
const UNCAPPED_CLIP_SECONDS = 99999;

function clipSecondsForAmount(amountCents) {
  for (let i = 0; i < AMOUNT_TIER_CENTS.length; i++) {
    if (amountCents <= AMOUNT_TIER_CENTS[i]) return AMOUNT_TIER_SECONDS[i];
  }
  return UNCAPPED_CLIP_SECONDS;
}

function currentClipSeconds() {
  const amountDollars = parseFloat(document.getElementById('amount').value) || 0;
  return clipSecondsForAmount(Math.round(amountDollars * 100));
}

let player = null;
let duration = 0;
let videoId = null;
let previewTimer = null;

function extractId(raw) {
  raw = raw.trim();
  if (/^[A-Za-z0-9_-]{11}$/.test(raw)) return raw;
  const m = raw.match(/(?:youtube\.com\/watch\?v=|youtube\.com\/shorts\/|youtu\.be\/|youtube\.com\/embed\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}

function fmt(s) {
  s = Math.max(0, Math.round(s));
  const m = Math.floor(s / 60), sec = s % 60;
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

// Deliberately no "$100 = no limit" promise here — a long clip only plays
// in full if nobody else is queued behind it by the time it comes up
// (the backend caps it to 3 min if someone's waiting), so the copy stays
// honest about that instead of over-promising.
function updateClipLabel() {
  const start = parseInt(document.getElementById('startRange').value, 10);
  const clipSeconds = currentClipSeconds();
  const noteEl = document.getElementById('clipNote');
  if (clipSeconds >= 3600) {
    document.getElementById('clipLabel').textContent = `${fmt(start)} → plays till it's over`;
    noteEl.textContent = "(if no one's queued after you — otherwise capped at 3 min)";
  } else {
    document.getElementById('clipLabel').textContent = `${fmt(start)} → ${fmt(Math.min(start + clipSeconds, duration))}`;
    noteEl.textContent = '';
  }
}

function updateRangeMax() {
  const range = document.getElementById('startRange');
  const clipSeconds = currentClipSeconds();
  const maxStart = clipSeconds >= 3600
    ? Math.max(0, Math.floor(duration - 1))
    : Math.max(0, Math.floor(duration - clipSeconds));
  const prevValue = parseInt(range.value, 10) || 0;
  range.max = maxStart;
  if (prevValue > maxStart) range.value = maxStart;
  updateClipLabel();
}

let ytApiReady = false;
window.onYouTubeIframeAPIReady = function() { ytApiReady = true; };

document.getElementById('loadBtn').addEventListener('click', () => {
  const id = extractId(document.getElementById('url').value);
  const status = document.getElementById('status');
  if (!id) { status.textContent = "Couldn't find a YouTube video in that link."; return; }
  status.textContent = '';
  videoId = id;
  document.getElementById('deck').style.display = 'block';

  const spawn = () => {
    if (player) { player.loadVideoById(id); return; }
    player = new YT.Player('ytplayer', {
      videoId: id,
      playerVars: { playsinline: 1, controls: 1 },
      events: {
        onReady: () => {
          duration = player.getDuration() || 0;
          document.getElementById('startRange').value = 0;
          updateRangeMax();
          player.pauseVideo();
        },
        onStateChange: (e) => {
          document.getElementById('vinyl').classList.toggle('spin', e.data === YT.PlayerState.PLAYING);
        }
      }
    });
  };
  if (ytApiReady) spawn(); else { const t = setInterval(() => { if (ytApiReady) { clearInterval(t); spawn(); } }, 150); }
});

document.getElementById('startRange').addEventListener('input', () => {
  updateClipLabel();
  if (player && player.seekTo) player.seekTo(parseInt(document.getElementById('startRange').value, 10), true);
});

document.getElementById('amount').addEventListener('input', () => {
  if (player) updateRangeMax();
});

document.getElementById('previewBtn').addEventListener('click', () => {
  if (!player) return;
  clearTimeout(previewTimer);
  const start = parseInt(document.getElementById('startRange').value, 10);
  player.seekTo(start, true);
  player.playVideo();
  previewTimer = setTimeout(() => player.pauseVideo(), 5000);
});

document.getElementById('payBtn').addEventListener('click', async () => {
  const status = document.getElementById('status');
  if (!videoId) { status.textContent = 'Load a track first.'; return; }
  const start = parseInt(document.getElementById('startRange').value, 10) || 0;
  const amountDollars = parseFloat(document.getElementById('amount').value) || 0;
  if (amountDollars < 2) { status.textContent = 'Minimum donation is $2.'; return; }

  const payBtn = document.getElementById('payBtn');
  payBtn.disabled = true;
  status.style.color = '#8a7f6a';
  status.textContent = 'Setting up payment…';
  try {
    const resp = await fetch(`${API_BASE}/busking/api/checkout`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
      body: JSON.stringify({
        youtube_url: videoId,
        start_seconds: start,
        amount_cents: Math.round(amountDollars * 100),
      }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'Something went wrong');
    window.location.href = data.checkout_url;
  } catch (err) {
    status.style.color = '#c93f2c';
    status.textContent = err.message;
    payBtn.disabled = false;
  }
});
</script>
</body>
</html>
